name: test

# 実行時は標準ライブラリだけで動くので、CIに要るのは pytest ひとつ。
# fontTools はフォントのサブセットを作るときにしか使わない。
on:
  push:
  pull_request:

# 読み取りだけあれば足りる
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

      # dist/ はコミットされた生成物。コードを直して作り直し忘れると、配布物と
      # 実装が黙ってずれる——貼っている人には古い絵が出続ける。出力は決定的
      # （同じ入力なら同じバイト列）なので、作り直して差分が出たら落とせる。
      - name: dist が実装と一致しているか
        run: |
          python -m pomodoro._generate.gen_variants --out /tmp/dist
          diff -r dist /tmp/dist
        env:
          PYTHONPATH: src
